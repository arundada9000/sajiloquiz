name: Feature request
description: Suggest an idea for Sajilo Quiz.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the idea. Note: this is a proprietary project; please review the license before submitting."
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What do you want to solve or improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
