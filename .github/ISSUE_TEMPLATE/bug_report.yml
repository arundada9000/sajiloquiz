name: Bug report
description: Report a problem so it can be fixed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please remove the contributor instructions before submitting."
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 128"
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme and mode
      options:
        - "Default / Auto"
        - "Light"
        - "Dark"
        - "A specific theme (say which)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you did.
      placeholder: "1. Went to... 2. Clicked... 3. Saw..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots (image files are fine to attach).
